# Checks the formatting and lint of the package, and runs its tests.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    # Pull requests from branches of this repository are already checked on push
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run the pre-commit hooks on every file
        run: pipx run pre-commit run --all-files --show-diff-on-failure --color always

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest version setup.py allows, and the one the HARP validation workflow runs
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pyharp and its test dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU builds first, or descript-audiotools pulls CUDA builds of torch from PyPI
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      - name: Run the tests
        run: pytest tests
